<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 마음 글귀 - 감정별 명언 처방전</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Serif Korean & Pretendard fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                        serif: ['Gowun Batang', 'serif'],
                    },
                    colors: {
                        happy: { light: '#FFF9E6', main: '#FFB800', border: '#FFE599', text: '#996D00' },
                        excited: { light: '#FFF0F5', main: '#FF6B8B', border: '#FFC2D1', text: '#B82E4D' },
                        sad: { light: '#F0F4FF', main: '#4A72FF', border: '#C2D4FF', text: '#1E3A99' },
                        burnout: { light: '#F5F5F7', main: '#8E8E93', border: '#D1D1D6', text: '#48484A' },
                        anxious: { light: '#F0FDF4', main: '#10B981', border: '#A7F3D0', text: '#047857' }
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' }
                        }
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        float: 'float 3s ease-in-out infinite'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            transition: background-color 0.5s ease;
        }
        .quote-font {
            font-family: 'Gowun Batang', serif;
        }
        /* Custom Scrollbar for list modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-rose-200 selection:text-rose-900">

    <!-- Header Navigation -->
    <header class="w-full max-w-4xl mx-auto px-4 py-4 sm:py-6 flex justify-between items-center">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="resetToHome()">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-400 to-amber-300 flex items-center justify-center text-white shadow-md shadow-rose-200">
                <i class="fa-solid font-bold fa-heart text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-800">마음 글귀</h1>
                <p class="text-xs text-slate-400 hidden sm:block">당신의 오늘을 다정하게 감싸주는 명언</p>
            </div>
        </div>
        <button onclick="openManageModal()" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition shadow-sm text-xs sm:text-sm font-medium">
            <i class="fa-solid fa-sliders text-xs"></i>
            <span>명언 목록 관리</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl mx-auto px-4 py-4 flex-grow flex flex-col justify-center items-center">
        
        <!-- Emotion Selector Section -->
        <section class="w-full text-center mb-6 sm:mb-8">
            <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-2">지금 어떤 마음에 머물러 있나요?</h2>
            <p class="text-xs sm:text-sm text-slate-500 mb-6">마음 상태에 꼭 맞는 문장을 선물해 드릴게요.</p>
            
            <!-- Emotion Buttons Container -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 sm:gap-3 w-full">
                <!-- Happy -->
                <button onclick="selectEmotion('happy')" id="btn-happy" class="emotion-btn flex flex-col items-center justify-center p-3 sm:p-4 rounded-2xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 transform hover:-translate-y-1 active:scale-95 group">
                    <span class="text-2xl sm:text-3xl mb-1 group-hover:scale-110 transition-transform">☀️</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-700">기쁘고 행복함</span>
                </button>
                <!-- Excited -->
                <button onclick="selectEmotion('excited')" id="btn-excited" class="emotion-btn flex flex-col items-center justify-center p-3 sm:p-4 rounded-2xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 transform hover:-translate-y-1 active:scale-95 group">
                    <span class="text-2xl sm:text-3xl mb-1 group-hover:scale-110 transition-transform">🚀</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-700">즐겁고 기대됨</span>
                </button>
                <!-- Sad -->
                <button onclick="selectEmotion('sad')" id="btn-sad" class="emotion-btn flex flex-col items-center justify-center p-3 sm:p-4 rounded-2xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 transform hover:-translate-y-1 active:scale-95 group">
                    <span class="text-2xl sm:text-3xl mb-1 group-hover:scale-110 transition-transform">🌧️</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-700">슬프고 우울함</span>
                </button>
                <!-- Burnout -->
                <button onclick="selectEmotion('burnout')" id="btn-burnout" class="emotion-btn flex flex-col items-center justify-center p-3 sm:p-4 rounded-2xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 transform hover:-translate-y-1 active:scale-95 group">
                    <span class="text-2xl sm:text-3xl mb-1 group-hover:scale-110 transition-transform">🔋</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-700">지치고 번아웃</span>
                </button>
                <!-- Anxious (Col-span-2 on mobile center or grid item) -->
                <button onclick="selectEmotion('anxious')" id="btn-anxious" class="emotion-btn col-span-2 sm:col-span-1 flex flex-col items-center justify-center p-3 sm:p-4 rounded-2xl bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 transform hover:-translate-y-1 active:scale-95 group">
                    <span class="text-2xl sm:text-3xl mb-1 group-hover:scale-110 transition-transform">🌿</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-700">불안하고 스트레스</span>
                </button>
            </div>
        </section>

        <!-- Quote Card Display Area -->
        <section id="quote-card-container" class="w-full relative min-h-[280px] sm:min-h-[320px] flex items-center justify-center">
            
            <!-- Default Welcome Placeholder -->
            <div id="placeholder-box" class="w-full bg-white/70 backdrop-blur-md rounded-3xl p-8 sm:p-12 text-center border border-slate-200/60 shadow-xl shadow-slate-100/50 flex flex-col items-center justify-center space-y-3">
                <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-2 animate-float">
                    <i class="fa-solid fa-sparkles text-2xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-700">위의 감정 버튼을 살포시 눌러주세요</h3>
                <p class="text-xs sm:text-sm text-slate-400 max-w-sm">지금 느끼는 마음 그대로 선택하시면, 그 마음을 다독여 줄 따뜻한 글귀를 전해드릴게요.</p>
            </div>

            <!-- Quote Card (Initially hidden) -->
            <div id="quote-card" class="hidden w-full bg-white rounded-3xl p-6 sm:p-10 border shadow-xl transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
                <!-- Quote Icon Background Deco -->
                <div class="absolute -top-4 -right-4 text-slate-100/60 text-9xl font-serif pointer-events-none select-none">“</div>
                
                <!-- Category Badge -->
                <div class="flex justify-between items-center mb-6">
                    <span id="quote-badge" class="px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase flex items-center gap-1.5">
                        <span id="quote-badge-icon"></span>
                        <span id="quote-badge-text">감정 이름</span>
                    </span>
                    <div class="flex items-center space-x-1 text-slate-400">
                        <button onclick="copyQuote()" title="명언 복사하기" class="p-2 rounded-xl hover:bg-slate-100 hover:text-slate-700 transition active:scale-90">
                            <i class="fa-regular fa-copy text-base"></i>
                        </button>
                    </div>
                </div>

                <!-- Quote Body -->
                <div class="my-auto py-2">
                    <p id="quote-text" class="quote-font text-lg sm:text-2xl text-slate-800 leading-relaxed sm:leading-loose font-normal mb-6 break-keep">
                        "명언 내용이 들어갈 자리입니다."
                    </p>
                    <p id="quote-author" class="text-right text-xs sm:text-sm font-medium text-slate-500 tracking-wide">
                        ― 발언자
                    </p>
                </div>

                <!-- Action Button inside Card -->
                <div class="mt-8 pt-6 border-t border-slate-100 flex justify-center">
                    <button onclick="showRandomQuoteForCurrentEmotion()" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-slate-900 text-white hover:bg-slate-800 active:scale-95 transition shadow-md shadow-slate-200 flex items-center justify-center space-x-2 text-sm font-semibold">
                        <i class="fa-solid fa-rotate-right text-xs"></i>
                        <span>다른 명언 보기</span>
                    </button>
                </div>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl mx-auto px-4 py-6 text-center text-xs text-slate-400">
        <p>© 2026 오늘의 마음 글귀. 매일 한 줄의 따뜻함.</p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur-sm text-white px-5 py-2.5 rounded-full text-xs sm:text-sm shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50 flex items-center space-x-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">클립보드에 복사되었습니다!</span>
    </div>

    <!-- Management Modal -->
    <div id="manage-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="manage-modal-card">
            
            <!-- Modal Header -->
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <div>
                    <h3 class="text-lg font-bold text-slate-800">명언 목록 관리</h3>
                    <p class="text-xs text-slate-400">원하는 명언을 직접 추가하거나 삭제할 수 있습니다.</p>
                </div>
                <button onclick="closeManageModal()" class="w-8 h-8 rounded-full bg-slate-200/60 hover:bg-slate-200 flex items-center justify-center text-slate-500 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Content (Scrollable) -->
            <div class="p-6 overflow-y-auto space-y-6 flex-grow">
                
                <!-- Add New Quote Form -->
                <div class="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200/80">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-plus-circle text-rose-500"></i> 새 명언 추가하기
                    </h4>
                    <form onsubmit="handleAddQuote(event)" class="space-y-3">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div class="sm:col-span-1">
                                <label class="block text-xs font-medium text-slate-600 mb-1">감정 선택</label>
                                <select id="new-quote-category" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-rose-400">
                                    <option value="happy">☀️ 기쁘고 행복함</option>
                                    <option value="excited">🚀 즐겁고 기대됨</option>
                                    <option value="sad">🌧️ 슬프고 우울함</option>
                                    <option value="burnout">🔋 지치고 번아웃</option>
                                    <option value="anxious">🌿 불안하고 스트레스</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-medium text-slate-600 mb-1">발언자 / 출처</label>
                                <input type="text" id="new-quote-author" placeholder="예: 앨버트 아인슈타인" required class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-rose-400">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">명언 문장</label>
                            <textarea id="new-quote-text" rows="2" placeholder="마음에 남길 다정한 문장을 입력하세요." required class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 resize-none"></textarea>
                        </div>
                        <div class="flex justify-end">
                            <button type="submit" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs sm:text-sm font-semibold transition active:scale-95 shadow-sm">
                                명언 추가하기
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Manage Existing List -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center space-x-2">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">등록된 명언 목록</h4>
                            <span id="manage-count-badge" class="bg-slate-200 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded-full">0개</span>
                        </div>
                        <!-- Category Filter for Management -->
                        <select id="manage-filter-category" onchange="renderManageList()" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-600 focus:outline-none">
                            <option value="all">전체 감정 보기</option>
                            <option value="happy">☀️ 기쁘고 행복함</option>
                            <option value="excited">🚀 즐겁고 기대됨</option>
                            <option value="sad">🌧️ 슬프고 우울함</option>
                            <option value="burnout">🔋 지치고 번아웃</option>
                            <option value="anxious">🌿 불안하고 스트레스</option>
                        </select>
                    </div>

                    <!-- Quote List Items -->
                    <div id="manage-quote-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                        <!-- Rendered by JS -->
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <button onclick="confirmResetDefaults()" class="text-xs text-rose-500 hover:text-rose-700 underline font-medium flex items-center gap-1">
                    <i class="fa-solid fa-arrow-rotate-left"></i> 초기 상태로 복원
                </button>
                <button onclick="closeManageModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs sm:text-sm font-semibold transition">
                    닫기
                </button>
            </div>

        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Default Quote Database (At least 20 per emotion category)
        const DEFAULT_QUOTES = {
            happy: [
                { id: "h1", text: "행복은 이미 만들어져 있는 것이 아니다. 당신의 행동에서 나온다.", author: "달라이 라마" },
                { id: "h2", text: "당신이 웃을 때 세상도 당신과 함께 웃는다.", author: "엘버트 허버드" },
                { id: "h3", text: "기쁨은 나누면 두 배가 되고, 슬픔은 나누면 반이 된다.", author: "스웨덴 속담" },
                { id: "h4", text: "가장 큰 행복은 우리가 사랑받고 있다는 확신이다.", author: "빅토르 위고" },
                { id: "h5", text: "오늘이란 날은 두 번 다시 오지 않는다.", author: "단테" },
                { id: "h6", text: "행복의 문 하나가 닫히면 다른 문이 열린다.", author: "헬렌 켈러" },
                { id: "h7", text: "미소는 마음의 문을 열어주는 가장 예쁜 열쇠다.", author: "작자 미상" },
                { id: "h8", text: "당신의 하루를 당신이 좋아하는 것들로 소중히 채워보세요.", author: "마음 글귀" },
                { id: "h9", text: "행복은 향수와 같다. 자신에게 뿌리지 않고는 남에게 뿜어낼 수 없다.", author: "랄프 왈도 에머슨" },
                { id: "h10", text: "지금 이 순간 즐겁게 지내는 것이 바로 성공한 삶이다.", author: "작자 미상" },
                { id: "h11", text: "기분 좋은 생각이 기분 좋은 일들을 계속 끌어당긴다.", author: "론다 번" },
                { id: "h12", text: "우리가 행복을 바라는 이유는 살아있는 기쁨을 온전히 느끼기 위함이다.", author: "스피노자" },
                { id: "h13", text: "행복해서 웃는 것이 아니라, 웃어서 행복한 것이다.", author: "윌리엄 제임스" },
                { id: "h14", text: "햇살처럼 맑은 그대의 마음이 오늘 하루를 밝게 비춥니다.", author: "마음 글귀" },
                { id: "h15", text: "가장 빛나는 날은 아직 오지 않았다. 하지만 오늘도 충분히 눈부시다.", author: "파블로 네루다" },
                { id: "h16", text: "당신이 기뻐할 때 주변 세상도 더 따뜻하게 번져갑니다.", author: "작자 미상" },
                { id: "h17", text: "작은 감사함들이 모여 커다란 행복의 꽃을 피운다.", author: "작자 미상" },
                { id: "h18", text: "오늘 쏟아지는 기쁨을 하나도 놓치지 말고 온전히 누리세요.", author: "마음 글귀" },
                { id: "h19", text: "행복은 먼 곳에 있지 않고, 바로 나의 마음 자세 안에 있다.", author: "마르쿠스 아우렐리우스" },
                { id: "h20", text: "당신의 미소는 누군가의 하루를拯救하는 기적일 수 있습니다.", author: "작자 미상" }
            ],
            excited: [
                { id: "e1", text: "미래는 자신의 꿈의 아름다움을 믿는 사람들의 것이다.", author: "엘리너 루스벨트" },
                { id: "e2", text: "시작하는 방법은 말하기를 그만두고 행동하는 것이다.", author: "월트 디즈니" },
                { id: "e3", text: "위대한 일을 하는 유일한 방법은 당신이 하는 일을 사랑하는 것이다.", author: "스티브 잡스" },
                { id: "e4", text: "용기란 눈앞의 두려움을 딛고 한 걸음 더 나아가는 것이다.", author: "월리엄 칠리" },
                { id: "e5", text: "당신이 할 수 있다고 믿든 할 수 없다고 믿든, 당신이 옳다.", author: "헨리 포드" },
                { id: "e6", text: "오늘 당신이 내딛는 작은 발걸음이 내일의 기적을 만든다.", author: "작자 미상" },

                { id: "b14", text: "오늘 하루 만큼은 나 자신만을 위한 너그러운 날로 만들어보세요.", author: "마음 글귀" },
                { id: "b15", text: "자신을 억지로 내몰지 마세요. 마음의 소리에 귀 기울일 시간입니다.", author: "작자 미상" },

                { id: "b19", text: "당신이 기대만큼 하지 못했어도 오늘 하루 훌륭하게 버텨냈습니다.", author: "마음 글귀" },
                { id: "b20", text: "아무것도 안 하는 날이 있어도 세상은 무너지지 않습니다.", author: "작자 미상" }
            ],
            anxious: [
                { id: "a1", text: "우리가 하는 걱정의 90%는 일어나지 않을 일들에 대한 것이다.", author: "어네스트 헤밍웨이" },
                { id: "a2", text: "깊게 호흡해 보세요. 지금 이 순간 당신은 안전합니다.", author: "마음 글귀" },
                { id: "a3", text: "바람이 세게 불수록 뿌리는 더 깊어진다.", author: "영국 속담" },
                { id: "a4", text: "미래를 예측하는 가장 좋은 방법은 미래를 직접 창조하는 것이다.", author: "피터 드러커" },
                { id: "a5", text: "당신이 통제할 수 없는 일은 내려놓는 지혜를 배우세요.", author: "에픽테토스" },
                { id: "a6", text: "불안은 당신의 마음이 잠시 길을 잃었다는 신호일 뿐입니다.", author: "마음 글귀" },
                { id: "a7", text: "오늘 할 수 있는 한 걸음에만 집중하세요. 다음 발걸음은 나중에 생각해도 됩니다.", author: "작자 미상" },
                { id: "a8", text: "지나간 과거도, 다가오지 않은 미래도 아닌 지금 '현재'에 머물러 보세요.", author: "틱낫한" },
                { id: "a9", text: "당신은 생각보다 훨씬 더 강하고 단단한 사람입니다.", author: "A.A. 밀른" },
                { id: "a10", text: "마음이 요동칠 때는 발바닥이 땅에 닿는 느낌에 집중해보세요.", author: "마음 글귀" },
                { id: "a11", text: "불안감이 밀려올 때 그것에 맞서 싸우기보다 흐르도록 놔두세요.", author: "작자 미상" },
                { id: "a12", text: "어두운 터널도 결국엔 밝은 빛이 나오는 출구로 연결되어 있습니다.", author: "작자 미상" },
                { id: "a13", text: "차분하게 마음을 가라앉히면 문제는 생각보다 작게 보입니다.", author: "작자 미상" },
                { id: "a14", text: "모든 것을 당장 해결할 필요는 없습니다. 천천히 가도 괜찮습니다.", author: "마음 글귀" },
                { id: "a15", text: "당신을 괴롭히는 그 생각이 진짜 사실인지 조용히 되물어보세요.", author: "바이런 케이티" },
                { id: "a16", text: "평온함은 세상이 조용할 때가 아닌, 내 마음이 평안을 선택할 때 온다.", author: "작자 미상" },
                { id: "a17", text: "당신에겐 어떤 상황도 잘 헤쳐나갈 지혜가 이미 갖춰져 있습니다.", author: "마음 글귀" },
                { id: "a18", text: "걱정을 털어내기 힘들 땐 신체 활동을 통해 마음을 환기해보세요.", author: "작자 미상" },
                { id: "a19", text: "스스로를 믿으세요. 지금까지도 당신은 수많은 불안을 이겨내 왔습니다.", author: "작자 미상" },
                { id: "a20", text: "지금 긴장을 풀고 shoulder(어깨)의 힘을 조용히 빼보세요.", author: "마음 글귀" }
            ]
        };

        // Category Metadata
        const CATEGORIES = {
            happy: {
                name: "기쁘고 행복함",
                icon: "☀️",
                bgClass: "bg-happy-light",
                borderClass: "border-happy-border",
                textClass: "text-happy-text",
                badgeBg: "bg-amber-100",
                badgeText: "text-amber-800"
            },
            excited: {
                name: "즐겁고 기대됨",
                icon: "🚀",
                bgClass: "bg-excited-light",
                borderClass: "border-excited-border",
                textClass: "text-excited-text",
                badgeBg: "bg-rose-100",
                badgeText: "text-rose-800"
            },
            sad: {
                name: "슬프고 우울함",
                icon: "🌧️",
                bgClass: "bg-sad-light",
                borderClass: "border-sad-border",
                textClass: "text-sad-text",
                badgeBg: "bg-indigo-100",
                badgeText: "text-indigo-800"
            },
            burnout: {
                name: "지치고 번아웃",
                icon: "🔋",
                bgClass: "bg-burnout-light",
                borderClass: "border-burnout-border",
                textClass: "text-burnout-text",
                badgeBg: "bg-slate-200",
                badgeText: "text-slate-800"
            },
            anxious: {
                name: "불안하고 스트레스",
                icon: "🌿",
                bgClass: "bg-anxious-light",
                borderClass: "border-anxious-border",
                textClass: "text-anxious-text",
                badgeBg: "bg-emerald-100",
                badgeText: "text-emerald-800"
            }
        };

        // Application State
        let quoteStore = {};
        let currentEmotion = null;
        let lastDisplayedIndex = -1;

        // Initialize App
        window.onload = function() {
            loadQuotesFromStorage();
        };

        // Load quotes from LocalStorage or initialize with defaults
        function loadQuotesFromStorage() {
            const stored = localStorage.getItem('mind_quotes_data');
            if (stored) {
                try {
                    quoteStore = JSON.parse(stored);
                } catch(e) {
                    console.error("Failed to parse stored quotes, loading default.", e);
                    quoteStore = JSON.parse(JSON.stringify(DEFAULT_QUOTES));
                }
            } else {
                quoteStore = JSON.parse(JSON.stringify(DEFAULT_QUOTES));
                saveQuotesToStorage();
            }
        }

        // Save current quotes to LocalStorage
        function saveQuotesToStorage() {
            localStorage.setItem('mind_quotes_data', JSON.stringify(quoteStore));
        }

        // Emotion Selection Handler
        function selectEmotion(emotionKey) {
            currentEmotion = emotionKey;
            lastDisplayedIndex = -1; // Reset last index for new emotion

            // Update Emotion Buttons Active Styling
            document.querySelectorAll('.emotion-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-800', 'bg-slate-50', 'scale-[1.02]');
            });
            const activeBtn = document.getElementById(`btn-${emotionKey}`);
            if (activeBtn) {
                activeBtn.classList.add('ring-2', 'ring-offset-2', 'ring-slate-800', 'scale-[1.02]');
            }

            // Body Background Shift
            const categoryMeta = CATEGORIES[emotionKey];
            document.body.className = `min-h-screen flex flex-col justify-between selection:bg-rose-200 selection:text-rose-900 ${categoryMeta.bgClass}`;

            // Show Quote Card Animation & Display
            showRandomQuoteForCurrentEmotion();
        }

        // Pick and show a random quote for current emotion
        function showRandomQuoteForCurrentEmotion() {
            if (!currentEmotion) return;

            const list = quoteStore[currentEmotion] || [];
            if (list.length === 0) {
                showToast("해당 감정에 등록된 명언이 없습니다. 추가해 주세요!", "warning");
                return;
            }

            // Pick random index ensuring different from last if > 1 item
            let randomIndex;
            if (list.length === 1) {
                randomIndex = 0;
            } else {
                do {
                    randomIndex = Math.floor(Math.random() * list.length);
                } while (randomIndex === lastDisplayedIndex);
            }
            lastDisplayedIndex = randomIndex;

            const quote = list[randomIndex];
            const meta = CATEGORIES[currentEmotion];

            // Hide placeholder, show card
            const placeholder = document.getElementById('placeholder-box');
            const card = document.getElementById('quote-card');

            placeholder.classList.add('hidden');
            card.classList.remove('hidden');

            // Apply card styling matching emotion
            card.className = `w-full bg-white rounded-3xl p-6 sm:p-10 border shadow-xl transition-all duration-300 relative overflow-hidden flex flex-col justify-between ${meta.borderClass} animate-fadeIn`;

            // Set Content
            document.getElementById('quote-badge-icon').textContent = meta.icon;
            document.getElementById('quote-badge-text').textContent = meta.name;
            document.getElementById('quote-badge').className = `px-3 py-1 rounded-full text-xs font-bold tracking-wide flex items-center gap-1.5 ${meta.badgeBg} ${meta.badgeText}`;

            document.getElementById('quote-text').textContent = `"${quote.text}"`;
            document.getElementById('quote-author').textContent = `― ${quote.author}`;
        }

        // Reset App View to Home
        function resetToHome() {
            currentEmotion = null;
            document.querySelectorAll('.emotion-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-800', 'scale-[1.02]');
            });
            document.body.className = "bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-rose-200 selection:text-rose-900";
            
            document.getElementById('quote-card').classList.add('hidden');
            document.getElementById('placeholder-box').classList.remove('hidden');
        }

        // Copy quote text to clipboard
        function copyQuote() {
            const text = document.getElementById('quote-text').textContent;
            const author = document.getElementById('quote-author').textContent;
            const fullText = `${text} ${author} [오늘의 마음 글귀]`;

            // Clipboard fallback logic
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(fullText).then(() => {
                    showToast("클립보드에 따뜻한 글귀가 복사되었습니다!");
                }).catch(() => {
                    fallbackCopyText(fullText);
                });
            } else {
                fallbackCopyText(fullText);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("클립보드에 따뜻한 글귀가 복사되었습니다!");
            } catch (err) {
                showToast("복사에 실패했습니다.", "error");
            }
            document.body.removeChild(textArea);
        }

        // Toast Notification System
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;

            if (type === "warning") {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }

        // Modal Open / Close Logic
        function openManageModal() {
            renderManageList();
            const modal = document.getElementById('manage-modal');
            const card = document.getElementById('manage-modal-card');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closeManageModal() {
            const modal = document.getElementById('manage-modal');
            const card = document.getElementById('manage-modal-card');

            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Render quotes list inside manager modal
        function renderManageList() {
            const filterCategory = document.getElementById('manage-filter-category').value;
            const container = document.getElementById('manage-quote-list');
            container.innerHTML = '';

            let allQuotes = [];
            
            if (filterCategory === 'all') {
                Object.keys(quoteStore).forEach(cat => {
                    quoteStore[cat].forEach(q => {
                        allQuotes.push({ ...q, category: cat });
                    });
                });
            } else {
                (quoteStore[filterCategory] || []).forEach(q => {
                    allQuotes.push({ ...q, category: filterCategory });
                });
            }

            document.getElementById('manage-count-badge').textContent = `${allQuotes.length}개`;

            if (allQuotes.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">등록된 명언이 없습니다. 위의 양식으로 추가해보세요.</div>`;
                return;
            }

            allQuotes.forEach(item => {
                const catMeta = CATEGORIES[item.category];
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-slate-100/80 transition border border-slate-200/60 text-xs sm:text-sm";
                div.innerHTML = `
                    <div class="flex-grow pr-3">
                        <div class="flex items-center space-x-1.5 mb-1">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${catMeta.badgeBg} ${catMeta.badgeText}">
                                ${catMeta.icon} ${catMeta.name}
                            </span>
                            <span class="text-slate-400 font-medium text-[11px]">― ${item.author}</span>
                        </div>
                        <p class="text-slate-700 font-normal line-clamp-2 quote-font">"${item.text}"</p>
                    </div>
                    <button onclick="deleteQuote('${item.category}', '${item.id}')" class="text-slate-400 hover:text-rose-500 p-2 transition flex-shrink-0" title="삭제">
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        // Add quote form submit handler
        function handleAddQuote(e) {
            e.preventDefault();
            const cat = document.getElementById('new-quote-category').value;
            const author = document.getElementById('new-quote-author').value.trim();
            const text = document.getElementById('new-quote-text').value.trim();

            if (!author || !text) return;

            const newId = "custom_" + Date.now();
            const newQuote = { id: newId, text: text, author: author };

            if (!quoteStore[cat]) {
                quoteStore[cat] = [];
            }

            quoteStore[cat].unshift(newQuote);
            saveQuotesToStorage();

            // Reset form
            document.getElementById('new-quote-author').value = '';
            document.getElementById('new-quote-text').value = '';

            renderManageList();
            showToast("새 명언이 성공적으로 추가되었습니다!");

            // If active category is current emotion, refresh display optionally
            if (currentEmotion === cat) {
                showRandomQuoteForCurrentEmotion();
            }
        }

        // Delete quote by ID
        function deleteQuote(category, id) {
            if (!quoteStore[category]) return;

            quoteStore[category] = quoteStore[category].filter(q => q.id !== id);
            saveQuotesToStorage();
            renderManageList();
            showToast("명언을 삭제하였습니다.", "warning");

            // Refresh current display if deleted from active category
            if (currentEmotion === category) {
                showRandomQuoteForCurrentEmotion();
            }
        }

        // Reset store back to default values
        function confirmResetDefaults() {
            if (confirm("모든 맞춤 추가/삭제 내용이 사라지고 초기 100개 명언 목록으로 복원됩니다. 계속하시겠습니까?")) {
                quoteStore = JSON.parse(JSON.stringify(DEFAULT_QUOTES));
                saveQuotesToStorage();
                renderManageList();
                showToast("초기 기본 명언 상태로 복원되었습니다!");
                if (currentEmotion) {
                    showRandomQuoteForCurrentEmotion();
                }
            }
        }
    </script>
</body>
</html>
