<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 서명도장 생성기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for Korean -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Nanum+Gothic:wght@700&family=Nanum+Myeongjo:wght@700&family=Black+Han+Sans&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <style>
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif; }
        .font-batang { font-family: 'Gowun Batang', serif; }
        .font-gothic { font-family: 'Nanum Gothic', sans-serif; }
        .font-black { font-family: 'Black Han Sans', sans-serif; }
        .font-gaegu { font-family: 'Gaegu', cursive; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
        <!-- 좌측: 설정 패널 -->
        <div class="p-6 md:p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-100">
            <div>
                <div class="flex items-center gap-2 mb-6">
                    <span class="text-2xl">✒️</span>
                    <h1 class="text-xl font-bold text-slate-900">디지털 서명도장 생성기</h1>
                </div>

                <!-- 이름 입력 -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-1">도장에 새길 이름 (3글자 추천)</label>
                    <input type="text" id="nameInput" value="홍길동" maxlength="5" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-base font-semibold" placeholder="예: 홍길동">
                </div>

                <!-- '인' 글자 추가 옵션 -->
                <div class="mb-5 flex items-center gap-2">
                    <input type="checkbox" id="addIn" checked class="w-4 h-4 text-red-600 rounded border-slate-300 focus:ring-red-500 cursor-pointer">
                    <label for="addIn" class="text-sm font-medium text-slate-700 cursor-pointer">끝에 '인' 자 자동으로 붙이기 (예:
