<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 시작 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12201d;
    --panel: #1a2b27;
    --panel-line: #2a3d38;
    --amber: #e0a458;
    --amber-dim: #a97c42;
    --text: #eee6d8;
    --text-dim: #93a49b;
    --text-faint: #5f7169;
    --done: #7fa587;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
  }

  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    background-image:
      radial-gradient(ellipse 60% 40% at 30% 0%, rgba(224,164,88,0.07), transparent 60%);
  }

  .page{
    width: 100%;
    max-width: 640px;
  }

  /* ---------- 시간 영역 ---------- */
  .clock-block{
    margin-bottom: 3.2rem;
  }

  .time{
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: clamp(3.2rem, 9vw, 5.5rem);
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .time .colon{
    color: var(--amber);
  }

  .date-row{
    margin-top: 0.7rem;
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  .greeting{
    color: var(--text-faint);
  }

  .date-row .dot{
    color: var(--text-faint);
  }

  /* ---------- 검색 영역 ---------- */
  .search-block{
    margin-bottom: 3.6rem;
  }

  .search-form{
    position: relative;
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 0 0.4rem 0 1.1rem;
    transition: border-color 0.2s ease;
  }

  .search-form:focus-within{
    border-color: var(--amber-dim);
  }

  .search-form svg{
    flex: none;
    width: 17px;
    height: 17px;
    color: var(--text-faint);
  }

  .search-form input[type="text"]{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: "Inter", sans-serif;
    font-size: 1rem;
    padding: 0.95rem 0.8rem;
  }

  .search-form input[type="text"]::placeholder{
    color: var(--text-faint);
  }

  .search-form button{
    flex: none;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: "Inter", sans-serif;
    font-size: 0.85rem;
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    border-radius: 2px;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .search-form button:hover{
    color: var(--amber);
    background: rgba(224,164,88,0.08);
  }

  /* ---------- 할 일 영역 ---------- */
  .todo-block h2{
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text-dim);
    margin: 0 0 1rem 0;
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .todo-block h2 .rule{
    flex: 1;
    height: 1px;
    background: var(--panel-line);
  }

  .todo-count{
    color: var(--text-faint);
    font-weight: 400;
  }

  .todo-list{
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .todo-item{
    display: flex;
    align-items: flex-start;
    gap: 0.85rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--panel-line);
  }

  .todo-item:first-child{
    padding-top: 0;
  }

  .todo-check{
    flex: none;
    width: 17px;
    height: 17px;
    margin-top: 0.15rem;
    border: 1px solid var(--text-faint);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    position: relative;
    padding: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .todo-check:hover{
    border-color: var(--amber);
  }

  .todo-item.done .todo-check{
    background: var(--done);
    border-color: var(--done);
  }

  .todo-check svg{
    position: absolute;
    top: 1px;
    left: 1px;
    width: 13px;
    height: 13px;
    opacity: 0;
    color: var(--bg);
  }

  .todo-item.done .todo-check svg{
    opacity: 1;
  }

  .todo-text{
    flex: 1;
    font-size: 0.98rem;
    line-height: 1.4;
    color: var(--text);
    word-break: break-word;
    padding-top: 0.02rem;
  }

  .todo-item.done .todo-text{
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--panel-line);
  }

  .todo-remove{
    flex: none;
    background: transparent;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0.1rem 0.2rem;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }

  .todo-item:hover .todo-remove{
    opacity: 1;
  }

  .todo-remove:hover{
    color: #c56a5a;
  }

  .todo-empty{
    color: var(--text-faint);
    font-size: 0.92rem;
    padding: 0.6rem 0;
    font-style: italic;
  }

  .todo-add{
    margin-top: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .todo-add .plus{
    flex: none;
    color: var(--text-faint);
    font-size: 1.1rem;
    width: 17px;
    text-align: center;
  }

  .todo-add input{
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--panel-line);
    outline: none;
    color: var(--text);
    font-family: "Inter", sans-serif;
    font-size: 0.98rem;
    padding: 0.4rem 0.1rem;
  }

  .todo-add input::placeholder{
    color: var(--text-faint);
  }

  .todo-add input:focus{
    border-bottom-color: var(--amber-dim);
  }

  @media (max-width: 480px){
    body{ padding: 8vh 6vw; }
    .clock-block{ margin-bottom: 2.4rem; }
    .search-block{ margin-bottom: 2.8rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="clock-block">
    <div class="time" id="clock">--:--</div>
    <div class="date-row">
      <span class="greeting" id="greeting"></span>
      <span class="dot">·</span>
      <span id="dateText"></span>
    </div>
  </div>

  <div class="search-block">
    <form class="search-form" id="searchForm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Google 검색" autocomplete="off" autofocus>
      <button type="submit">검색</button>
    </form>
  </div>

  <div class="todo-block">
    <h2>오늘의 할 일 <span class="rule"></span> <span class="todo-count" id="todoCount"></span></h2>
    <ul class="todo-list" id="todoList"></ul>
    <div class="todo-add">
      <span class="plus">+</span>
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" autocomplete="off">
    </div>
  </div>

</div>

<script>
  // ---------- 시계 ----------
  const clockEl = document.getElementById('clock');
  const dateEl = document.getElementById('dateText');
  const greetingEl = document.getElementById('greeting');

  const weekdays = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

  function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    clockEl.innerHTML = h + '<span class="colon">:</span>' + m;

    const y = now.getFullYear();
    const mo = now.getMonth() + 1;
    const d = now.getDate();
    const wd = weekdays[now.getDay()];
    dateEl.textContent = `${y}년 ${mo}월 ${d}일 ${wd}`;

    const hour = now.getHours();
    let greeting = '좋은 밤이에요';
    if (hour >= 5 && hour < 12) greeting = '좋은 아침이에요';
    else if (hour >= 12 && hour < 18) greeting = '좋은 오후예요';
    else if (hour >= 18 && hour < 23) greeting = '좋은 저녁이에요';
    greetingEl.textContent = greeting;
  }

  updateClock();
  setInterval(updateClock, 1000 * 10);
  setInterval(() => {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    clockEl.innerHTML = h + '<span class="colon">:</span>' + m;
  }, 1000);

  // ---------- 검색 ----------
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');

  searchForm.addEventListener('submit', function(e){
    e.preventDefault();
    const q = searchInput.value.trim();
    if (q === '') return;
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    window.open(url, '_blank', 'noopener,noreferrer');
  });

  // ---------- 할 일 목록 ----------
  const STORAGE_KEY = 'my-start-page-todos';
  const listEl = document.getElementById('todoList');
  const inputEl = document.getElementById('todoInput');
  const countEl = document.getElementById('todoCount');

  function loadTodos(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveTodos(todos){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  let todos = loadTodos();

  function render(){
    listEl.innerHTML = '';

    if (todos.length === 0){
      const empty = document.createElement('li');
      empty.className = 'todo-empty';
      empty.textContent = '아직 할 일이 없어요. 아래에서 추가해 보세요.';
      listEl.appendChild(empty);
    }

    todos.forEach((todo, i) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'todo-check';
      check.setAttribute('aria-label', todo.done ? '완료 취소' : '완료로 표시');
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      check.onclick = () => {
        todos[i].done = !todos[i].done;
        saveTodos(todos);
        render();
      };

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = todo.text;

      const remove = document.createElement('button');
      remove.className = 'todo-remove';
      remove.setAttribute('aria-label', '삭제');
      remove.textContent = '×';
      remove.onclick = () => {
        todos.splice(i, 1);
        saveTodos(todos);
        render();
      };

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(remove);
      listEl.appendChild(li);
    });

    const remaining = todos.filter(t => !t.done).length;
    countEl.textContent = todos.length ? `${remaining}개 남음` : '';
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && inputEl.value.trim() !== ''){
      todos.push({ text: inputEl.value.trim(), done: false });
      saveTodos(todos);
      inputEl.value = '';
      render();
    }
  });

  render();
</script>

</body>
</html>
